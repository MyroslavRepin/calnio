<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- prerender.js fills the marker below with each page's own head tags.
         The tags after it are the same on every page. -->
    <!--head-->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Calnio" />
    <meta property="og:image" content="https://calnio.myroslavrepin.com/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://calnio.myroslavrepin.com/og.jpg" />
    <!-- Umami analytics (self-hosted); data-domains keeps localhost dev visits out,
         data-performance adds Web Vitals. recorder.js does the click/scroll heatmaps
         (switched on per site in Umami settings). -->
    <script defer src="https://analytics.myroslavrepin.com/script.js" data-website-id="dfdaccb7-d57e-43c9-bfe7-913b8205e1f7" data-domains="calnio.myroslavrepin.com" data-performance="true"></script>
    <script defer src="https://analytics.myroslavrepin.com/recorder.js" data-website-id="dfdaccb7-d57e-43c9-bfe7-913b8205e1f7"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
