# Production only. Dev runs two local processes instead:
#   uv run uvicorn main:app --reload --port 8080   +   npm run dev
# One service: the image already contains the built Vue app, and the database is
# managed (Neon), so there is nothing else to bring up.
name: calnio

services:
  backend:
    build: .
    env_file: .env.prod
    ports:
      - "8080:8080"
    restart: unless-stopped
